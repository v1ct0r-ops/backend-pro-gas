name: Backend — Tests Unitarios y API

# Dispara en cada push a las ramas de desarrollo activo.
# Los tests unitarios no requieren BD real; los de API usan mini-app con mocks.
on:
  push:
    branches: ["dev", "qa"]

jobs:
  tests:
    name: Pytest — cobertura de servicios y endpoints
    runs-on: ubuntu-latest

    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Instalar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Correr tests unitarios y de API
        env:
          # Variables requeridas por pydantic-settings al importar los módulos.
          # No apuntan a una BD real — los tests mockean get_db completamente.
          DATABASE_URL: "postgresql+psycopg2://ci:ci@localhost/ci"
          SECRET_KEY: "clave-dummy-solo-para-ci-no-usar-en-produccion"
          CORS_ORIGINS: "http://localhost:3000"
        run: |
          pytest tests/ \
            --ignore=tests/test_ventas_acidas.py \
            -v \
            --tb=short

      - name: Publicar resumen de cobertura en el log
        if: always()
        env:
          DATABASE_URL: "postgresql+psycopg2://ci:ci@localhost/ci"
          SECRET_KEY: "clave-dummy-solo-para-ci-no-usar-en-produccion"
          CORS_ORIGINS: "http://localhost:3000"
        run: |
          pytest tests/ \
            --ignore=tests/test_ventas_acidas.py \
            --cov=app/services \
            --cov-report=term-missing \
            -q
